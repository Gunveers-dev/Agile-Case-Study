<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" preserveAspectRatio="xMaxYMax slice">
  <defs>
    <radialGradient id="windowGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#F6DDB0"/>
      <stop offset="1" stop-color="#D99E5E"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FBD38D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FBD38D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="readability" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19313B" stop-opacity="0.96"/>
      <stop offset="0.45" stop-color="#19313B" stop-opacity="0.78"/>
      <stop offset="0.8" stop-color="#19313B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="720" height="900" fill="#19313B"/>

  <!-- back wall panels -->
  <rect x="0" y="0" width="720" height="900" fill="#1E3943"/>
  <rect x="330" y="0" width="390" height="900" fill="#213F4A"/>

  <!-- arched window -->
  <g transform="translate(440 120)">
    <path d="M0 520 V180 A130 130 0 0 1 260 180 V520 Z" fill="#2C4A55"/>
    <path d="M16 508 V184 A114 114 0 0 1 244 184 V508 Z" fill="url(#windowGlow)"/>
    <!-- distant clouds -->
    <ellipse cx="80" cy="300" rx="70" ry="20" fill="#F9E7C6" opacity="0.65"/>
    <ellipse cx="190" cy="250" rx="60" ry="16" fill="#FBEACC" opacity="0.6"/>
    <ellipse cx="150" cy="380" rx="90" ry="22" fill="#F2CF98" opacity="0.55"/>
    <!-- mullions -->
    <rect x="126" y="70" width="8" height="440" fill="#2C4A55"/>
    <rect x="16" y="250" width="228" height="7" fill="#2C4A55"/>
    <rect x="16" y="380" width="228" height="7" fill="#2C4A55"/>
    <path d="M30 184 A100 100 0 0 1 230 184" fill="none" stroke="#2C4A55" stroke-width="7"/>
    <!-- sill -->
    <rect x="-14" y="512" width="288" height="16" rx="3" fill="#3A5964"/>
  </g>

  <!-- light falling into the room -->
  <path d="M456 640 L700 640 L720 900 L380 900 Z" fill="#F3D3A0" opacity="0.07"/>

  <!-- tall bookshelf -->
  <g transform="translate(150 70)">
    <rect x="0" y="0" width="250" height="700" fill="#162B33"/>
    <rect x="12" y="12" width="226" height="676" fill="#132730"/>
    <g fill="#2B4650">
      <rect x="12" y="142" width="226" height="10"/>
      <rect x="12" y="282" width="226" height="10"/>
      <rect x="12" y="422" width="226" height="10"/>
      <rect x="12" y="562" width="226" height="10"/>
    </g>
    <!-- shelf 1 -->
    <g transform="translate(20 44)">
      <rect x="0" y="22" width="16" height="76" fill="#8C4A2F"/>
      <rect x="18" y="10" width="20" height="88" fill="#C65D32"/>
      <rect x="40" y="18" width="14" height="80" fill="#E8DCC8"/>
      <rect x="56" y="6" width="22" height="92" fill="#2E4E59"/>
      <rect x="80" y="26" width="15" height="72" fill="#D9A15B"/>
      <rect x="97" y="14" width="18" height="84" fill="#4F6D7A"/>
      <rect x="117" y="30" width="14" height="68" fill="#B5786B"/>
      <rect x="140" y="38" width="62" height="14" rx="2" fill="#E8DCC8" transform="rotate(-18 140 52)"/>
      <rect x="160" y="74" width="50" height="24" fill="#3A5964"/>
    </g>
    <!-- shelf 2 -->
    <g transform="translate(20 184)">
      <rect x="0" y="14" width="22" height="84" fill="#2E4E59"/>
      <rect x="24" y="22" width="14" height="76" fill="#D9A15B"/>
      <rect x="40" y="8" width="18" height="90" fill="#8C4A2F"/>
      <rect x="60" y="20" width="16" height="78" fill="#E8DCC8"/>
      <rect x="78" y="12" width="20" height="86" fill="#C65D32"/>
      <rect x="112" y="18" width="16" height="80" fill="#4F6D7A" transform="rotate(12 120 98)"/>
      <rect x="150" y="16" width="18" height="82" fill="#B5786B"/>
      <rect x="170" y="26" width="14" height="72" fill="#2E4E59"/>
      <rect x="186" y="10" width="20" height="88" fill="#D9A15B"/>
    </g>
    <!-- shelf 3 -->
    <g transform="translate(20 324)">
      <rect x="0" y="66" width="90" height="16" fill="#C65D32"/>
      <rect x="6" y="50" width="80" height="16" fill="#E8DCC8"/>
      <rect x="2" y="34" width="86" height="16" fill="#2E4E59"/>
      <rect x="104" y="12" width="18" height="86" fill="#4F6D7A"/>
      <rect x="124" y="22" width="14" height="76" fill="#D9A15B"/>
      <rect x="140" y="6" width="22" height="92" fill="#8C4A2F"/>
      <rect x="164" y="18" width="16" height="80" fill="#E8DCC8"/>
      <rect x="182" y="28" width="22" height="70" fill="#C65D32"/>
    </g>
    <!-- shelf 4 -->
    <g transform="translate(20 464)">
      <rect x="0" y="10" width="18" height="88" fill="#D9A15B"/>
      <rect x="20" y="20" width="22" height="78" fill="#2E4E59"/>
      <rect x="44" y="14" width="14" height="84" fill="#C65D32"/>
      <rect x="60" y="26" width="16" height="72" fill="#B5786B"/>
      <rect x="78" y="8" width="20" height="90" fill="#4F6D7A"/>
      <rect x="100" y="18" width="16" height="80" fill="#E8DCC8"/>
      <circle cx="160" cy="76" r="22" fill="#3A5964"/>
      <rect x="150" y="40" width="20" height="14" rx="3" fill="#2E4E59"/>
    </g>
  </g>

  <!-- plant on the sill -->
  <g transform="translate(610 560)">
    <path d="M0 70 h56 l-8 50 h-40 z" fill="#A9573A"/>
    <path d="M28 70 C10 30 -20 20 -40 -10" stroke="#4E6E50" stroke-width="4" fill="none"/>
    <path d="M28 70 C40 20 70 0 90 -30" stroke="#4E6E50" stroke-width="4" fill="none"/>
    <path d="M28 70 C26 30 30 0 24 -40" stroke="#4E6E50" stroke-width="4" fill="none"/>
    <ellipse cx="-30" cy="0" rx="22" ry="10" fill="#6A8F62" transform="rotate(35 -30 0)"/>
    <ellipse cx="-6" cy="28" rx="20" ry="9" fill="#5E7F5A" transform="rotate(20 -6 28)"/>
    <ellipse cx="78" cy="-18" rx="22" ry="10" fill="#6A8F62" transform="rotate(-40 78 -18)"/>
    <ellipse cx="56" cy="16" rx="20" ry="9" fill="#5E7F5A" transform="rotate(-25 56 16)"/>
    <ellipse cx="22" cy="-30" rx="9" ry="20" fill="#7FA273" transform="rotate(-8 22 -30)"/>
  </g>

  <!-- desk -->
  <rect x="0" y="742" width="720" height="18" fill="#6B4430"/>
  <rect x="0" y="760" width="720" height="140" fill="#4A2F22"/>

  <!-- lamp -->
  <g transform="translate(270 560)">
    <ellipse cx="40" cy="60" rx="150" ry="120" fill="url(#lampGlow)"/>
    <path d="M0 60 L80 60 L62 0 L18 0 Z" fill="#E7B66B"/>
    <path d="M0 60 L80 60 L74 46 L6 46 Z" fill="#D59A4E"/>
    <rect x="37" y="60" width="6" height="110" fill="#2B3A3F"/>
    <ellipse cx="40" cy="178" rx="34" ry="8" fill="#2B3A3F"/>
  </g>

  <!-- stack of books with spine titles -->
  <g transform="translate(410 618)" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#E9C27D">
    <rect x="20" y="0" width="270" height="40" rx="3" fill="#24434E"/>
    <rect x="20" y="0" width="14" height="40" fill="#1B343D"/>
    <text x="80" y="27">Algorithms</text>
    <rect x="4" y="42" width="290" height="40" rx="3" fill="#7D3E25"/>
    <rect x="4" y="42" width="14" height="40" fill="#6A331E"/>
    <text x="96" y="69">AI &amp; ML</text>
    <rect x="30" y="84" width="262" height="40" rx="3" fill="#2E4E59"/>
    <rect x="30" y="84" width="14" height="40" fill="#24434E"/>
    <text x="90" y="111">Databases</text>
  </g>

  <!-- small open book on desk -->
  <g transform="translate(150 712)">
    <path d="M0 30 Q50 10 100 28 Q150 10 200 30 L200 36 Q150 18 100 34 Q50 18 0 36 Z" fill="#F1E6D2"/>
    <path d="M100 28 L100 34" stroke="#C9B898" stroke-width="2"/>
  </g>

  <!-- readability overlay for the heading on the left -->
  <rect width="720" height="900" fill="url(#readability)"/>
</svg>
