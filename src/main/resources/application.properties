# ============================================================
#  LibraTrack - Smart Library Management System
# ============================================================
spring.application.name=LibraTrack
server.port=8080

# ---------- H2 database (persistent, file-based) ----------
# Data is stored in ./data/libratrack.mv.db (relative to the project folder)
# so records survive application restarts.
spring.datasource.url=jdbc:h2:file:./data/libratrack;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- H2 web console (development only) ----------
# Open http://localhost:8080/h2-console after logging in
# JDBC URL: jdbc:h2:file:./data/libratrack   User: sa   Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Sessions ----------
server.servlet.session.timeout=60m

# ---------- LibraTrack ----------
# Insert demo books, members and loans on the very first start (skipped if data already exists)
libratrack.seed-demo-data=true
